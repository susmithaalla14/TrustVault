<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — TrustVault</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('login')}"></div>

<main class="main-wrapper" style="display: flex; justify-content: center; align-items: center; min-height: 75vh;">
    <div class="card" style="width: 100%; max-width: 440px;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px;">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 28px; height: 28px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h2 style="font-size: 1.6rem; font-weight: 700; color: #fff;">Sign in to TrustVault</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;">
                Enter your credentials to access your secure documents
            </p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" required placeholder="admin or username" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.8rem;">
                Authenticate &rarr;
            </button>
        </form>

        <!-- Evaluator One-Click Fill -->
        <div style="margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
            <div style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.75rem; text-align: center;">
                ⚡ Quick Fill Demo Accounts (For Evaluators):
            </div>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;">
                <button type="button" class="btn btn-secondary btn-sm" onclick="fillLogin('admin', 'Admin@TrustVault2026!')">
                    Admin
                </button>
                <button type="button" class="btn btn-secondary btn-sm" onclick="fillLogin('susu_owner', 'Owner@TrustVault2026!')">
                    Owner
                </button>
                <button type="button" class="btn btn-secondary btn-sm" onclick="fillLogin('susu_viewer', 'Viewer@TrustVault2026!')">
                    Viewer
                </button>
            </div>
        </div>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-secondary);">
            Don't have an account? <a th:href="@{/register}" style="color: var(--emerald-light); font-weight: 600; text-decoration: none;">Register here</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/navbar :: footer}"></div>

<script>
function fillLogin(user, pass) {
    document.getElementById('username').value = user;
    document.getElementById('password').value = pass;
}
</script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
