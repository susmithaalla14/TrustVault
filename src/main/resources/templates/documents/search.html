<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Vault — TrustVault</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('search')}"></div>

<main class="main-wrapper">
    <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2rem; font-weight: 800; color: #fff;">Search Vault</h1>
        <p style="color: var(--text-secondary); font-size: 0.95rem;">
            Search your documents by filename, title, category, or owner
        </p>
    </div>

    <div class="card" style="margin-bottom: 2rem;">
        <form th:action="@{/documents/search}" method="get" style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end;">
            <div style="flex: 3; min-width: 250px;">
                <label for="searchQuery">Search Query</label>
                <input type="text" id="searchQuery" name="q" th:value="${query}" placeholder="Search by title, original filename, or keyword...">
            </div>

            <div style="flex: 1; min-width: 180px;">
                <label for="categoryFilter">Category</label>
                <select id="categoryFilter" name="category">
                    <option value="" th:selected="${category == ''}">All Categories</option>
                    <option value="General" th:selected="${category == 'General'}">General</option>
                    <option value="Financial" th:selected="${category == 'Financial'}">Financial</option>
                    <option value="Legal" th:selected="${category == 'Legal'}">Legal</option>
                    <option value="Identification" th:selected="${category == 'Identification'}">Identification</option>
                    <option value="Medical" th:selected="${category == 'Medical'}">Medical</option>
                    <option value="Confidential" th:selected="${category == 'Confidential'}">Confidential</option>
                </select>
            </div>

            <div>
                <button type="submit" class="btn btn-primary" style="padding: 0.75rem 1.5rem;">
                    🔍 Search
                </button>
            </div>
        </form>
    </div>

    <!-- Results Section -->
    <div class="card">
        <h3 style="font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 1.25rem;">
            Search Results <span style="font-size: 0.9rem; color: var(--text-secondary); font-weight: 400;" th:text="'(' + ${documents.size()} + ' documents found)'">(0)</span>
        </h3>

        <div class="table-responsive" th:if="${!documents.isEmpty()}">
            <table>
                <thead>
                    <tr>
                        <th>Title / Original File</th>
                        <th>Owner</th>
                        <th>Category</th>
                        <th>Size</th>
                        <th>Created Date</th>
                        <th style="text-align: right;">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="doc : ${documents}">
                        <td>
                            <a th:href="@{'/documents/' + ${doc.id}}" style="color: #fff; font-weight: 600; text-decoration: none;">
                                <span th:text="${doc.title}">Title</span>
                            </a>
                            <div style="font-size: 0.78rem; color: var(--text-muted);" th:text="${doc.originalFilename}">file.pdf</div>
                        </td>
                        <td th:text="${doc.owner.username}">owner</td>
                        <td>
                            <span class="badge badge-success" th:text="${doc.category}">General</span>
                        </td>
                        <td th:text="${doc.getFormattedSize()}">1.2 MB</td>
                        <td style="color: var(--text-secondary);" th:text="${#temporals.format(doc.createdAt, 'yyyy-MM-dd')}">2026-10-23</td>
                        <td style="text-align: right;">
                            <div style="display: inline-flex; gap: 0.5rem;">
                                <a th:href="@{'/documents/' + ${doc.id}}" class="btn btn-secondary btn-sm">Details</a>
                                <a th:href="@{'/documents/' + ${doc.id} + '/download'}" class="btn btn-primary btn-sm">Download</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${documents.isEmpty()}" style="text-align: center; padding: 2.5rem 1rem; color: var(--text-secondary);">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔍</div>
            <p>No matching documents found in your accessible vault.</p>
        </div>
    </div>
</main>

<div th:replace="~{fragments/navbar :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
