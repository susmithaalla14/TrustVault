<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Document — TrustVault</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('upload')}"></div>

<main class="main-wrapper" style="max-width: 800px;">
    <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2rem; font-weight: 800; color: #fff;">Upload Confidential Document</h1>
        <p style="color: var(--text-secondary); font-size: 0.95rem;">
            Uploaded binaries are encrypted in-transit and isolated in your private Supabase Storage bucket
        </p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="card">
        <form th:action="@{/documents/upload}" method="post" enctype="multipart/form-data">
            <!-- Drag and Drop Area -->
            <div id="dropZone" style="border: 2px dashed rgba(16, 185, 129, 0.3); border-radius: var(--radius-lg); padding: 3rem 2rem; text-align: center; cursor: pointer; transition: var(--transition); margin-bottom: 1.5rem;" onclick="document.getElementById('fileInput').click()">
                <div style="font-size: 3rem; margin-bottom: 0.5rem;">📤</div>
                <h3 style="font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 0.25rem;">
                    Drag and drop file here, or click to browse
                </h3>
                <p style="color: var(--text-secondary); font-size: 0.85rem;">
                    Supported: PDF, DOCX, XLSX, TXT, PNG, JPG &bull; Maximum file size: 20MB
                </p>
                
                <input type="file" id="fileInput" name="file" required style="display: none;" accept=".pdf,.docx,.xlsx,.txt,.png,.jpg,.jpeg">

                <!-- Selected file preview -->
                <div id="fileInfo" style="display: none; margin-top: 1.25rem; background: rgba(16, 185, 129, 0.15); border: 1px solid var(--border-color); padding: 0.75rem 1rem; border-radius: var(--radius-md); text-align: left;">
                    <div style="font-weight: 600; color: var(--emerald-light);" id="fileName">file.pdf</div>
                    <div style="font-size: 0.8rem; color: var(--text-secondary);" id="fileSize">1.2 MB</div>
                </div>
            </div>

            <div class="form-group">
                <label for="title">Document Title (Optional)</label>
                <input type="text" id="title" name="title" placeholder="Leave empty to use original file name">
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category">
                    <option value="General" selected>General</option>
                    <option value="Financial">Financial (Invoices, Tax, Banking)</option>
                    <option value="Legal">Legal (Contracts, Agreements, NDAs)</option>
                    <option value="Identification">Identification (Passports, ID Cards)</option>
                    <option value="Medical">Medical Records</option>
                    <option value="Confidential">Confidential / Proprietary</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <textarea id="description" name="description" rows="3" placeholder="Brief note about the purpose or contents of this document..."></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 2rem;">
                <a th:href="@{/documents}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary" style="padding: 0.75rem 2rem;">
                    Upload to Vault &rarr;
                </button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/navbar :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
