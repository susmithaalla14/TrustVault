# ===================================================================
# TrustVault Application Configuration
# ===================================================================
spring.application.name=trustvault

# Server Port (Render dynamically assigns $PORT; defaults to 8081 locally to prevent Oracle 8080 conflict)
server.port=${PORT:8081}

# ===================================================================
# Database Configuration (Supabase PostgreSQL / H2 Dev Fallback)
# ===================================================================
# In production on Render, set SPRING_DATASOURCE_URL to the Supabase connection string:
# jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require
# If no external PostgreSQL URL is provided, fallback to in-memory H2 for zero-friction local development.
spring.datasource.url=${SPRING_DATASOURCE_URL:${SUPABASE_DB_URL:jdbc:h2:mem:trustvault;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USER:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:}}

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ===================================================================
# Multipart File Upload Validation
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ===================================================================
# Supabase Private Storage Configuration
# ===================================================================
supabase.url=${SUPABASE_URL:https://tkksvfmtaoxlexcmngmk.supabase.co}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.bucket=${SUPABASE_STORAGE_BUCKET:TrustVault-documents}

# ===================================================================
# Actuator Health Check (for Render Health Checks)
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
